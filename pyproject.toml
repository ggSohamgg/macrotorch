[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrotorch"
version = "1.0.0"
description = "Custom CUDA kernels for 2D convolution with PyTorch-style API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ggSohamgg", email = "sohamaiuse@gmail.com"}
]
keywords = ["cuda", "deep-learning", "convolution", "gpu", "numba"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: CUDA :: DL",
]
dependencies = [
    "numpy>=1.21.0",
    "numba>=0.56.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "scipy>=1.7.0"]
benchmark = ["torch>=1.10.0", "scipy>=1.7.0"]

[project.urls]
Homepage = "https://github.com/ggSohamgg/macrotorch"
Repository = "https://github.com/ggSohamgg/macrotorch"
Documentation = "https://github.com/ggSohamgg/macrotorch#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["macrotorch*"]
